<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · El último refugio</title>
<style>
:root{color-scheme:dark;--bg:#101b1b;--panel:#192929;--line:#304443;--ink:#edf5ef;--muted:#a7b9b0;--accent:#a5e3bd}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 70% 0%,#25443b,transparent 45%),var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}.card{width:min(480px,100%);background:#192929ed;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 20px 80px #0005}.eyebrow{color:var(--accent);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;font-weight:700}h1{font-size:2.5rem;line-height:1.05;margin:12px 0}.muted{color:var(--muted)}label{display:block;margin:20px 0 7px;font-size:.9rem}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;background:#0e1919;color:var(--ink);font:inherit}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:11px;background:var(--accent);color:#10251d;font-weight:800;font-size:1rem;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.msg{margin-top:16px;color:var(--accent);min-height:25px}.back{display:inline-block;margin-top:20px;color:var(--muted);font-size:.9rem}
</style></head><body><main class="card"><div class="eyebrow">Matemática Discreta · Misión presencial</div><h1>El último refugio</h1><p class="muted">Introduce el código que aparece en clase y el alias con el que participarás.</p>
<form id="join"><label for="code">Código de sesión</label><input id="code" maxlength="8" required autocomplete="off" placeholder="Ej. 8A3F21BC"><label for="alias">Tu alias</label><input id="alias" maxlength="24" minlength="2" required autocomplete="nickname" placeholder="Ej. Explorador17"><button id="submit" type="submit">Entrar en la misión</button></form><div id="message" class="msg" role="status"></div><a class="back" href="./">← Volver a la portada</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://doxaerjjoeskaybqgdzz.supabase.co";
const SUPABASE_KEY="sb_publishable_roB89ujZfQ62q3lZ9Tkhtw_8ZXDymtP";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.querySelector("#join"),btn=document.querySelector("#submit"),msg=document.querySelector("#message");
form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;msg.textContent="Conectando con la instalación…";
const code=document.querySelector("#code").value.trim().toUpperCase(),alias=document.querySelector("#alias").value.trim();
const {data,error}=await db.rpc("join_game_session",{p_session_code:code,p_alias:alias});
if(error){msg.textContent=error.message.includes("alias")?"Ese alias ya está ocupado. Prueba otro.":error.message;btn.disabled=false;return}
const p=Array.isArray(data)?data[0]:data;
sessionStorage.setItem("refugio_participant_id",p.participant_id);sessionStorage.setItem("refugio_token",p.participant_token);sessionStorage.setItem("refugio_alias",p.participant_alias);sessionStorage.setItem("refugio_session_id",p.session_id);
msg.textContent="¡Acceso correcto! Preparando tu misión…";location.href="student-game.html";
});
</script></body></html>
