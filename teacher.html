<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel docente · El último refugio</title>
<style>
:root{color-scheme:dark;--bg:#101b1b;--panel:#192929;--line:#304443;--ink:#edf5ef;--muted:#a7b9b0;--accent:#a5e3bd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#25443b,transparent 40%),var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 36px));margin:50px auto}.eyebrow{color:var(--accent);letter-spacing:.15em;text-transform:uppercase;font-size:.75rem;font-weight:700}h1{font-size:2.5rem;margin:8px 0}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;margin:22px 0}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0e1919;color:var(--ink);font:inherit}button{border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:#10251d;font-weight:750;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#344b43;color:var(--ink)}button:disabled{opacity:.5}.hidden{display:none}.session{border-top:1px solid var(--line);padding:16px 0}.code{font-size:1.8rem;letter-spacing:.12em;color:var(--accent);font-weight:800}.msg{color:var(--accent);min-height:24px}a{color:var(--muted)}
</style></head><body><main class="wrap"><div class="eyebrow">Control de la misión</div><h1>Panel docente</h1><p class="muted">Accede con tu usuario de Supabase para preparar y controlar las sesiones.</p>
<section id="login" class="panel"><h2>Iniciar sesión</h2><form id="loginForm"><label>Correo electrónico</label><input id="email" type="email" required autocomplete="username"><label>Contraseña</label><input id="password" type="password" required autocomplete="current-password"><button>Entrar</button></form></section>
<section id="dashboard" class="hidden"><div class="panel"><h2>Nueva sesión</h2><label>Nombre de la sesión</label><input id="title" value="El último refugio"><button id="create">Crear sesión</button><div id="msg" class="msg"></div></div><div class="panel"><h2>Tus sesiones</h2><div id="sessions" class="muted">Cargando…</div></div><button id="logout" class="secondary">Cerrar sesión</button></section>
<a href="./">← Volver a la portada</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://doxaerjjoeskaybqgdzz.supabase.co","sb_publishable_roB89ujZfQ62q3lZ9Tkhtw_8ZXDymtP");
const login=document.querySelector("#login"),dash=document.querySelector("#dashboard"),msg=document.querySelector("#msg");
async function refresh(){const {data,error}=await db.rpc("get_teacher_sessions");const el=document.querySelector("#sessions");if(error){el.textContent=error.message;return}el.innerHTML="";
if(!data.length){el.textContent="Todavía no has creado sesiones.";return}
data.forEach(s=>{const d=document.createElement("div");d.className="session";const h=document.createElement("h3");h.textContent=s.session_title;const code=document.createElement("div");code.className="code";code.textContent=s.session_code;const info=document.createElement("p");info.className="muted";info.textContent=s.session_status+" · "+s.participant_count+" participantes";d.append(h,code,info);
const actions=document.createElement("div");const transitions={draft:["waiting","Abrir sala de espera"],waiting:["active","Iniciar partida"],active:["paused","Pausar"],paused:["active","Reanudar"],finished:[]};const t=transitions[s.session_status]||[];if(t.length){const b=document.createElement("button");b.textContent=t[1];b.onclick=async()=>{b.disabled=true;const {error}=await db.rpc("set_game_session_status",{p_session_id:s.session_id,p_new_status:t[0]});if(error)alert(error.message);refresh()};actions.append(b)}
if(s.session_status!=="finished"){const f=document.createElement("button");f.className="secondary";f.textContent="Finalizar";f.onclick=async()=>{if(confirm("¿Finalizar esta sesión?")){const {error}=await db.rpc("set_game_session_status",{p_session_id:s.session_id,p_new_status:"finished"});if(error)alert(error.message);refresh()}};actions.append(f)}
d.append(actions);el.append(d)})}
async function show(){const {data}=await db.auth.getSession();const signed=!!data.session;login.classList.toggle("hidden",signed);dash.classList.toggle("hidden",!signed);if(signed)refresh()}
document.querySelector("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:document.querySelector("#email").value,password:document.querySelector("#password").value});if(error)alert(error.message);show()});
document.querySelector("#create").onclick=async()=>{msg.textContent="Creando sesión…";const {data,error}=await db.rpc("create_game_session",{p_title:document.querySelector("#title").value});if(error){msg.textContent=error.message;return}msg.textContent="Sesión creada: "+data[0].new_session_code;refresh()};
document.querySelector("#logout").onclick=async()=>{await db.auth.signOut();show()};show();
</script></body></html>
